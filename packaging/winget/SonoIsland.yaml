    InstallerType: zip
    InstallerUrl: https://github.com/USER/SonoIsland/releases/download/v2.1.0/SonoIsland-win-x64.zip
    InstallerSha256: REPLACE_WITH_SHA256_OF_ZIP
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: SonoIsland.exe
        PortableCommandAlias: sonoisland
ManifestType: singleton
ManifestVersion: 1.6.0
