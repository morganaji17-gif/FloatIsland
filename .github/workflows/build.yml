name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release -p:Platform=x64

      - name: Logic self-test
        run: .\bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\FloatIsland.exe --selftest

      - name: Offscreen render smoke test
        run: .\bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\FloatIsland.exe --skia-shot

      - uses: actions/upload-artifact@v4
        with:
          name: render-samples
          path: bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/shots/
          if-no-files-found: error
