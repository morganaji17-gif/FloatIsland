name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Framework-dependent build (small). Users need the .NET 10 Desktop Runtime.
      - name: Publish
        run: dotnet publish SonoIsland.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained false -o dist

      - name: Zip
        run: Compress-Archive -Path dist\* -DestinationPath SonoIsland-win-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SonoIsland-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: SonoIsland-win-x64
          path: SonoIsland-win-x64.zip
