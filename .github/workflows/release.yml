name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      # Optional Authenticode signing. Set this repository secret to a base64-encoded
      # .pfx to have the zips signed; leave it unset and the step is skipped.
      SIGN_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained: no .NET runtime needed on the user's machine. Just unzip and run.
      - name: Publish (self-contained)
        run: dotnet publish FloatIsland.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o dist

      # Tiny variant for people who already have the .NET 10 Desktop Runtime.
      - name: Publish (framework-dependent)
        run: dotnet publish FloatIsland.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained false -o dist-fdd

      - name: Sign binaries (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          ./tools/sign.ps1 -Pfx $pfx -PfxPassword $env:SIGN_PFX_PASSWORD -Path dist
          ./tools/sign.ps1 -Pfx $pfx -PfxPassword $env:SIGN_PFX_PASSWORD -Path dist-fdd
          Remove-Item $pfx -Force

      - name: Add helper script + readme to the zips
        run: |
          Copy-Item Shortcuts.ps1 dist\
          Copy-Item Shortcuts.ps1 dist-fdd\
          $readme = @"
          Float Island - dynamic island for Spotify (Windows 11)

          1. Run FloatIsland.exe

          2. Optional: create Start Menu / Desktop shortcuts
             powershell -ExecutionPolicy Bypass -File .\Shortcuts.ps1

          The app is hidden until Spotify is playing. Right-click the island for the menu;
          the Settings row there covers scale, opacity, accent and monitor.
          If Windows SmartScreen warns, choose More info -> Run anyway.
          "@
          Set-Content dist\README.txt -Value $readme -Encoding UTF8
          Set-Content dist-fdd\README.txt -Value $readme -Encoding UTF8

      - name: Zip
        run: |
          Compress-Archive -Path dist\* -DestinationPath FloatIsland-win-x64.zip
          Compress-Archive -Path dist-fdd\* -DestinationPath FloatIsland-win-x64-fdd.zip
          Get-FileHash FloatIsland-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  FloatIsland-win-x64.zip" } | Set-Content SHA256SUMS.txt
          Get-FileHash FloatIsland-win-x64-fdd.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  FloatIsland-win-x64-fdd.zip" } | Add-Content SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FloatIsland-win-x64.zip
            FloatIsland-win-x64-fdd.zip
            SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: FloatIsland-win-x64
          path: |
            FloatIsland-win-x64*.zip
            SHA256SUMS.txt
